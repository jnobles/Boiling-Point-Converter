[project]
name = "boiling-point-converter"
authors = [
    {name = "James Nobles"},
]
version = "0.1.0"
description = "TUI application for Clausius-Clapeyron boiling point calculations."
requires-python = ">=3.12"
dependencies = ["textual>=0.70"]
license = {file = "LICENSE.txt"}
classifiers = [
    "Private :: Do Not Upload",
    "License :: OSI Approved :: MIT License"
]

[project.scripts]
boiling-point-converter = "boiling_point_converter.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "hypothesis",
    "pyinstaller"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boiling_point_converter"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv]
python-downloads = "manual"

[tool.pip-licenses]
ignore-packages = ["boiling-point-converter"]
output-file = "THIRD_PARTY_LICENSES.txt"
format = "plain-vertical"
with-authors = true
with-license-file = true
no-license-path = true