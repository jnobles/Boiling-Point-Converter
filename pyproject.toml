[project]
name = "boiling-point-converter"
version = "0.1.0"
description = "TUI application for Clausius-Clapeyron boiling point calculations."
requires-python = ">=3.12"

dependencies = [
    "textual>=0.70",
]

[project.scripts]
boiling-point-converter = "boiling_point_converter.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "hypothesis",
    "pyinstaller"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/boiling_point_converter"
]

[tool.ruff.lint]
extend-select = [
    "E501",  # Add "line too long" rule to set
]

[tool.uv]
python-downloads = "manual"