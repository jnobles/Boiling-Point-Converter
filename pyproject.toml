[project]
name = "boiling-point-converter"
authors = [
    {name = "James Nobles"},
]
version = "1.0.0"
description = "TUI application for Clausius-Clapeyron boiling point calculations."
requires-python = ">=3.12,<3.13"
dependencies = ["textual>=0.70"]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
classifiers = [
    "Private :: Do Not Upload",
    "License :: OSI Approved :: MIT License"
]

[project.scripts]
boiling-point-converter = "boiling_point_converter.__main__:main"

[project.urls]
repository = "https://github.com/jnobles/Boiling-Point-Converter"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/boiling_point_converter"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv]
python-downloads = "manual"

[tool.pip-licenses]
ignore-packages = ["boiling-point-converter"]
output-file = "THIRD_PARTY_LICENSES.txt"
format = "plain-vertical"
with-authors = true
with-license-file = true
no-license-path = true

[dependency-groups]
dev = [
    "coverage>=7.15.1",
    "hypothesis>=6.156.1",
    "pip-licenses>=5.5.5",
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "pytest-textual-snapshot>=1.0.0",
    "ruff>=0.15.20",
    "rust-just>=1.57.0",
]

[tool.coverage.run]
source = ["boiling_point_converter"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.html]
skip_covered = false
