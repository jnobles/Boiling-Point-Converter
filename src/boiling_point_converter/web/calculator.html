<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Boiling Point Calculator</title>

    <script defer src="./app.js"></script>
</head>
<body>

<form id="calculator">
    <fieldset>
        <legend>Reference Value</legend>
        <input id="reference-pressure" type="number">
        <label for="reference-pressure">Pressure</label>
        <input id="reference-temperature" type="number">
        <label for="reference-temperature">Temperature</label>
    </fieldset>
    <fieldset>
        <legend>Known Value</legend>
        <input id="mode-pressure" type="radio" name="solver-mode" value="pressure">
        <label for="mode-pressure">Pressure</label>
        <input id="mode-temperature" type="radio" name="solver-mode" value="temperature">
        <label for="mode-temperature">Temperature</label>
        <input id="at-value" type="number">
        <label for="at-value">Target Value</label>
    </fieldset>
    <button type="submit">Calculate</button>
</form>

<section id="result"></section>

</body>
</html>
